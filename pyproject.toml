[project]
name = "lsp-cli"
version = "0.18.18"
description = "Versioned Python symbols, source, bindings and execution events"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Delva0"}]
dependencies = ["pyan3==2.8.1", "ladybug==0.21.0", "ty==0.0.84", "fastembed==0.8.1"]

[project.urls]
Repository = "https://github.com/Delva0/lsp-cli"
Issues = "https://github.com/Delva0/lsp-cli/issues"

[project.scripts]
lsp = "pyrel.commands:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
