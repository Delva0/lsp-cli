name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      UV_PYTHON: ${{ matrix.python }}
      UV_MANAGED_PYTHON: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
      - name: Install rg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install rg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - run: uv sync --frozen --python ${{ matrix.python }}
      - name: Worker and platform contracts
        run: uv run --frozen pytest -q tests/test_service.py tests/test_platform_support.py tests/test_output_contract.py::test_shared_file_input_error_is_reported_once --maxfail=3 --junitxml=runtime-results.xml
      - name: Build wheel
        run: uv build
      - name: Installed-wheel smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/lsp-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/lsp-bin
        run: |
          LSP_CLI_SOURCE="$(realpath dist/lsp_cli-*.whl)" bash scripts/install.sh
          cd "$RUNNER_TEMP"
          printf 'def sample(): return 1\n' | "$UV_TOOL_BIN_DIR/lsp" show sample
          "$UV_TOOL_DIR/lsp-cli/bin/python" -I -c 'from lsp_cli.lsp.worker import Engine; from lsp_cli.identity import source_identity; assert "lsp/worker.py" in source_identity()["files"]; import importlib.util; assert importlib.util.find_spec("pyrel") is None; assert importlib.util.find_spec("graphub_lsp") is None'
          cd "$GITHUB_WORKSPACE"
          bash scripts/uninstall.sh
      - name: PowerShell installation and installed-wheel smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LSP_CLI_PYTHON: ${{ matrix.python }}
        run: |
          $env:PYTHONUTF8 = $null
          $env:UV_TOOL_DIR = Join-Path $env:RUNNER_TEMP 'lsp tools 中文 space'
          $env:UV_TOOL_BIN_DIR = Join-Path $env:RUNNER_TEMP 'lsp bin 中文 space'
          $env:LSP_CLI_SOURCE = (Get-ChildItem dist/lsp_cli-*.whl).FullName
          & ./scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/test_pwsh.ps1
          & ./scripts/uninstall.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regression suite
        run: uv run --frozen pytest -vv --ignore=tests/test_service.py --ignore=tests/test_platform_support.py --junitxml=test-results.xml
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: '*-results.xml'
